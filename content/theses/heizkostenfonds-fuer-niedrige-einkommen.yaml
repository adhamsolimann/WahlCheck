id: heizkostenfonds-fuer-niedrige-einkommen
topicId: arbeit-soziales
text: >-
  Berlin soll einen Heizkostenfonds einrichten, aus dem einkommensschwache
  Haushalte Zuschüsse zu Heiz- und Warmwasserkosten erhalten.
rationale: >-
  Konkretes Instrument gegen Energiearmut (Vorbild München); Linke legen im
  Programm einen solchen Fonds mit festen Förderbeträgen dar – unterscheidet
  soziale Absicherung im Energiebereich.
quickMode: false
sources:
  - label: Die Linke Berlin – Wahlprogramm 2026 (PDF)
    url: https://dielinke.berlin/fileadmin/download/2026/0106_Wahlprogramm_LVB_A5.pdf
