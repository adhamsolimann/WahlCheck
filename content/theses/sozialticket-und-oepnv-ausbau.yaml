id: sozialticket-und-oepnv-ausbau
topicId: mobilitaet
text: >-
  Günstige Sozialtickets sollen ausgebaut und der öffentliche Nahverkehr
  deutlich verdichtet werden (Takt, Linien, Personal).
rationale: >-
  ÖPNV ist für Berlin zentrale Daseinsvorsorge; FDP widmet Mobilität laut
  Tagesspiegel sogar mehr Programmplatz als die Grünen – das Feld differenziert
  über Finanzierung statt Grundsatz.
