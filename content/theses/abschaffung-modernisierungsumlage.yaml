id: abschaffung-modernisierungsumlage
topicId: wohnen
text: >-
  Die Umlage von Modernisierungskosten auf die Mieterinnen und Mieter (§ 559
  BGB) soll abgeschafft werden.
rationale: >-
  Modernisierungsumlagen treiben Mieten im Bestand; Linke fordern bundes- wie
  landespolitische Abschaffung, BSW will überzogene Modernisierungen begrenzen.
quickMode: false
