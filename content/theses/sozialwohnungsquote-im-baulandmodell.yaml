id: sozialwohnungsquote-im-baulandmodell
topicId: wohnen
text: >-
  Bei großen privaten Bauprojekten soll die Hälfte der Wohnungen gefördert
  (mietpreis- und belegungsgebunden) entstehen.
rationale: >-
  SPD will das kooperative Baulandmodell von 30 auf 50 Prozent anheben, Linke
  wollen sogar zwei Drittel; FDP lehnt Quoten zugunsten von Wohngeld ab.
quickMode: false
sources:
