id: besserer-personalschluessel-in-kitas
topicId: bildung
text: >-
  Der Personalschlüssel in Berliner Kitas soll verbessert und das Kita-Personal
  deutlich aufgestockt werden.
rationale: >-
  Kita-Qualität ist nach Schulen der wichtigste Bildungsbereich für Familien –
  eine Kernzielgruppe dieser Wahl; differenziert über Finanzierungs- und
  Personalkapazitätsfragen.
