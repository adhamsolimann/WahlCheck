  justificationQuote: 'Dank der von uns eingeführten Tariftreueklausel gilt: Öffentliches Geld geht nur an Auftragnehmer, die nach Tarif bezahlen.'
- thesisId: hitzeschutz-fuer-obdachlose
  stance: 1
  status: clear
  verification: "auto"
  justificationQuote: Die Hitzehilfe und die aufsuchende Sozialarbeit von Menschen, die auf der Straße leben, wollen wir stärken.
  sourceLabel: Die Linke Berlin – Wahlprogramm AGH 2026
  sourceUrl: https://dielinke.berlin/fileadmin/download/2026/0106_Wahlprogramm_LVB_A5.pdf
- thesisId: heizkostenfonds-fuer-niedrige-einkommen
  stance: 1
  status: clear
  justificationQuote: Mit einem Heizkostenfonds wollen wir Berliner*innen mit niedrigen Einkommen schnell und unbürokratisch unterstützen, wenn sie Heizkosten nicht mehr tragen können.
  sourceLabel: Die Linke Berlin – Wahlprogramm AGH 2026
  sourceUrl: https://dielinke.berlin/fileadmin/download/2026/0106_Wahlprogramm_LVB_A5.pdf
  verification: "auto"
