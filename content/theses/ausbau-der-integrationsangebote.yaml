id: ausbau-der-integrationsangebote
topicId: migration
text: >-
  Sprach-, Beratungs- und Integrationsangebote sollen deutlich ausgebaut und
  besser finanziert werden.
rationale: >-
  Positive Integrationspolitik als Gegenentwurf zu restriktiven Positionen;
  differenziert innerhalb des progressiven Lagers über Finanzierungsfragen und
  gegenüber allen restriktionsorientierten Parteien.
