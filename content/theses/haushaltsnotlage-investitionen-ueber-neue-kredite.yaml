id: haushaltsnotlage-investitionen-ueber-neue-kredite
topicId: haushalt-finanzen
text: >-
  Berlin soll zusätzliche Investitionen in Wohnen, Infrastruktur und Schulen
  auch über neue Kredite und Sondervermögen finanzieren.
rationale: >-
  Zentrale Finanzierungsfrage der Legislatur: SPD setzt auf ein
  Bundes-Sondervermögen mit sieben Investitionsschwerpunkten, Linke auf massive
  Eigenkapitalzuführung; FDP/AfD wollen stattdessen konsolidieren.
quickMode: true
sources:
