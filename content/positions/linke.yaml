  sourceLabel: Die Linke Berlin – Wahlprogramm AGH 2026
  sourceUrl: https://dielinke.berlin/fileadmin/download/2026/0106_Wahlprogramm_LVB_A5.pdf
  justificationQuote: Es lässt sich beobachten, dass immer mehr Polizei nicht zu mehr Sicherheit führt.
- thesisId: ausbau-videoueberwachung-oeffentlicher-raeume
  stance: -2
  status: clear
  sourceLabel: Die Linke Berlin – Wahlprogramm AGH 2026
  verification: "auto"
  justificationQuote: Orte und Waffenverbotszonen sind mit zusätzlichen polizeilichen Befugnissen wie Videoüberwachung oder anlasslosen Kontrollen verknüpft und somit ein Einfallstor für Racial Profiling
    und diskriminierendes Polizeihandeln. Sie wollen wir abschaffen.
