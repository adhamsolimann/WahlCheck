- date: "2026-08-22"
  title: "Forsa: Die Linke deutlich vorn — CDU und AfD gleichauf"
  excerpt: >-
    Knapp vier Wochen vor der Wahl kommt die Linke auf 22 %, CDU und AfD auf
    je 18 %, Grüne 16 %, SPD 12 %. BSW und FDP verpassen den Einzug. Rot-Grün-Rot
    wäre laut Umfrage das beliebteste Bündnis (37 %).
  sourceLabel: "WELT / Forsa für t-online"
