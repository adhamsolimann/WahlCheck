id: tariftreue-bei-oeffentlichen-auftraegen
topicId: arbeit-soziales
text: >-
  Vergabe öffentlicher Aufträge und Fördermittel soll an Tariftreue und gute
  Arbeitsbedingungen gebunden werden.
rationale: >-
  Arbeit & Soziales ist laut Tagesspiegel-Analyse das programmatisch größte
  Thema aller sieben Parteien; Tarifbindung im Landesumfeld ist der konkrete,
  landkompetente Hebel.
