id: ausbau-videoueberwachung-oeffentlicher-raeume
topicId: sicherheit
text: >-
  Die Videoüberwachung in öffentlichen Räumen (z. B. Bahnhöfe, Kieze,
  Transportmittel) soll deutlich ausgebaut werden.
rationale: >-
  Innere Sicherheit ist nach Wohnen eines der umkämpftesten Themen; Überwachung
  trennt ordnungspolitisch-authoritative von grundrechtsbetonten Positionen.
quickMode: true
