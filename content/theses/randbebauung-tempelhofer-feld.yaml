id: randbebauung-tempelhofer-feld
topicId: wohnen
text: >-
  Die Randbereiche des Tempelhofer Feldes sollen mit Wohnungen bebaut werden.
rationale: >-
  Symbolische Bau-/Naturschutz-Frage mit klarem Lagergegensatz; 2014 hatte eine
  Mehrheit die Bebauung per Volksentscheid abgelehnt, mehrere Parteien kehren
  zur Randbebauung zurück.
quickMode: false
sources:
  - label: rbb24 – Das planen die Berliner Parteien in der Wohnungspolitik (08/2026)
    url: https://www.rbb24.de/politik/berlin-wahl-2026/wahlprogramme/wohnen-bauen-mieten-check.html
