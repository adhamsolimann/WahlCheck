  partyId: oedp
  title: "ÖDP schafft vorzeitigen Wahlantritt — und kritisiert die Hürde"
  excerpt: >-
    2.345 gesammelte Unterschriften sichern die Teilnahme; die ÖDP fordert wie
    die Linke die Absenkung des Berliner Quorums von 2.200 Unterschriften für
    kleine Parteien.
  sourceLabel: "ÖDP Berlin – Pressemitteilung"
