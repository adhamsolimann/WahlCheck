id: mehr-reinigungspersonal-oeffentliche-raeume
topicId: stadtgesellschaft
text: >-
  Die Sauberkeit in Parks, U-Bahnhöfen und Straßen soll durch deutlich mehr
  Reinigungs- und Ordnungspersonal verbessert werden.
rationale: >-
  „Sauberkeit der Stadt" ist laut Tagesspiegel-Analyse ein eigenes
  Programmthema aller Parteien; konkreter als abstrakte Ordnungsrhetorik und
  eng verknüpft mit der Haushaltsfrage.
