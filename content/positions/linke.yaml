- thesisId: dezentrale-unterkuenfte-statt-notunterkuenfte
  stance: 1
  status: clear
  verification: "auto"
  justificationQuote: Dazu gehört, dass Geflüchtete nicht in inhumanen isolierten Massenunterkünften leben … Sie müssen Zugang zu Wohnungen haben und übergangsweise zu dezentralen, menschenrechtliche Standards wahrenden Unterkünften.
  sourceLabel: Die Linke Berlin – Wahlprogramm AGH 2026
  sourceUrl: https://dielinke.berlin/fileadmin/download/2026/0106_Wahlprogramm_LVB_A5.pdf
- thesisId: ausbau-der-integrationsangebote
  stance: 1
  status: clear
  verification: "auto"
  justificationQuote: Wir nutzen unsere Kompetenzen als Bundesland, um Berlin zu einem schützenden Zufluchtsort für Menschen in Not zu machen … Sie kann auch den Zugang zu den dringend notwendigen Sprachkursen und eine Teilhabe am kulturellen Leben ermöglichen.
  sourceLabel: Die Linke Berlin – Wahlprogramm AGH 2026
  sourceUrl: https://dielinke.berlin/fileadmin/download/2026/0106_Wahlprogramm_LVB_A5.pdf
- thesisId: stopp-der-a100-verlaengerung
  stance: 2
  status: clear
  justificationQuote: Wir fordern, dass die A100 qualifiziert am Treptower Park beendet und nicht weiter ausgebaut wird.
  sourceLabel: Die Linke Berlin – Wahlprogramm AGH 2026
  sourceUrl: https://dielinke.berlin/fileadmin/download/2026/0106_Wahlprogramm_LVB_A5.pdf
  verification: "auto"
- thesisId: tempo30-auf-hauptverkehrsstrassen
  stance: 2
  status: clear
  justificationQuote: Wir setzen uns im Bund für Tempo 30 als innerörtliche Regelgeschwindigkeit ein und nutzen unabhängig davon alle Möglichkeiten, um Tempo 30 auch auf Berliner Straßen umzusetzen.
  sourceLabel: Die Linke Berlin – Wahlprogramm AGH 2026
  sourceUrl: https://dielinke.berlin/fileadmin/download/2026/0106_Wahlprogramm_LVB_A5.pdf
  verification: "auto"
- thesisId: sozialticket-und-oepnv-ausbau
