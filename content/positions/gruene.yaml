  sourceUrl: https://gruene.berlin/fileadmin/BE/lv_berlin/files/Wahlprogramm_2026_Online.pdf
- thesisId: klimaneutralitaet-bis-2045
  stance: 1
  status: clear
  justificationQuote: Berlin muss sich ein Vorbild an Hamburg nehmen, das nun schon 2040 klimaneutral sein will. In Regierungsverantwortung werden wir den Fahrplan zur Klimaneutralität und -anpassung auf
    solide Beine stellen und Prioritäten setzen, um die Ziele schnellstmöglich zu erreichen.
