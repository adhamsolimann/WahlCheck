id: mietendeckel-landeseigene-wohnungsunternehmen
topicId: wohnen
text: >-
  Für die landeseigenen Wohnungsunternehmen soll ein Mietendeckel eingeführt
  werden.
rationale: >-
  Kerndifferenz im salienstärksten Thema Wohnen; landeseigene Unternehmen
  verwalten rund 400.000 Wohnungen, Mieterhöhungen dort sind zentraler
  Wahlkampfpunkt.
quickMode: true
