id: stopp-der-a100-verlaengerung
topicId: mobilitaet
text: >-
  Der Weiterbau/Ausbau der A100 soll gestoppt werden.
rationale: >-
  Symbolischer Großbau-Konflikt Berlins (Tunnel Schlangenbader Straße,
  Wohnungsbaupotenzial vs. Autoinfrastruktur); SPD plant u. a. Rückbau der
  ehemaligen A104-Fläche, während Ausbauvorhaben umkämpft bleiben.
quickMode: true
sources:
