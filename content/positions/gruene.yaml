  sourceUrl: https://gruene.berlin/fileadmin/BE/lv_berlin/files/Wahlprogramm_2026_Online.pdf
  justificationQuote: Dafür braucht es unter anderem starke Bezirke mit qualifiziertem Personal, Datenzugang sowie verbindlichen Kompetenzen bei Kontrolle, Beratung und rechtlicher Durchsetzung.
