  sourceLabel: Die Linke Berlin – Wahlprogramm AGH 2026
  sourceUrl: https://dielinke.berlin/fileadmin/download/2026/0106_Wahlprogramm_LVB_A5.pdf
  justificationQuote: Wir werden für Berlin ein Deutschland-Sozialticket einführen, damit sich auch Berliner*innen mit geringem Einkommen den Ausflug nach Brandenburg oder die Ostsee und den Familienbesuch leisten können.
- thesisId: prioritaet-fuer-radverkehr
  stance: 1
  status: clear
  verification: "auto"
  justificationQuote: In den öffentlichen Nahverkehr und den Fuß- und Radverkehr investieren und den BaumEntscheid konsequent umsetzen.
