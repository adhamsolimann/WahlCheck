  verification: auto
- thesisId: staerkere-besteurung-hoher-einkommen
  stance: 1
  status: clear
  justificationQuote: Wir werden die Einnahmen des Landes erhöhen und alle Möglichkeiten zur Umverteilung von oben nach unten nutzen. Deswegen wollen wir eine Luxusvillensteuer einführen.
  sourceLabel: Die Linke Berlin – Wahlprogramm AGH 2026
  sourceUrl: https://dielinke.berlin/fileadmin/download/2026/0106_Wahlprogramm_LVB_A5.pdf
