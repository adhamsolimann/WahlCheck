- thesisId: stopp-der-a100-verlaengerung
  stance: 1
  status: clear
  justificationQuote: Wir Bündnisgrüne lehnen den Weiterbau der Autobahn A 100 ab, denn der 17. Bauabschnitt würde für Ost-Berliner Kieze in Lichtenberg, Pankow und Friedrichshain noch mehr Stau, Lärm, Luftverschmutzung und Clubsterben bedeuten.
  sourceLabel: Bündnis 90/Die Grünen Berlin – Wahlprogramm 2026
