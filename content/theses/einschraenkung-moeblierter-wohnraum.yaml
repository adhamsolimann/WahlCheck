id: einschraenkung-moeblierter-wohnraum
topicId: wohnen
text: >-
  Die Vermietung von möbliertem Wohnraum auf Zeit soll rechtlich eingeschränkt
  werden.
rationale: >-
  Möbliertes Wohnen umgeht häufig Mieterschutz; SPD will Vermietung
  einschränken, Linke in Milieuschutzgebieten verbieten, BSW will Mikroapartments
  begrenzen – mehrparteienfähige Differenzlinie.
quickMode: false
sources:
