- thesisId: tempo30-auf-hauptverkehrsstrassen
  stance: 2
  status: clear
  justificationQuote: Wir schützen Leben mit so viel Tempo 30 wie möglich – insbesondere vor Kitas, Schulen, Spielplätzen, Senior*inneneinrichtungen, Einrichtungen der Behindertenhilfe und an Schulwegen
    – und kontrollieren Tempolimits konsequent.
  sourceLabel: Bündnis 90/Die Grünen Berlin – Wahlprogramm 2026
  sourceUrl: https://gruene.berlin/fileadmin/BE/lv_berlin/files/Wahlprogramm_2026_Online.pdf
