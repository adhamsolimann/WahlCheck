id: klimaneutralitaet-bis-2045
topicId: klima
text: >-
  Berlin soll sein Klimaneutralitätsziel spätestens 2045 erreichen und die
  Umsetzung verbindlich finanzieren.
rationale: >-
  Nach dem Volksentscheid „Berlin 2030 klimaneutral" (erfolgreich, aber
  umstritten) ist das Zieljahr der zentrale Klima-Grundsatzstreit; Klimaschutz
  ist Kompetenzfeld der Grünen (Ipsos).
quickMode: true
sources:
