id: digitalisierung-der-bauaemter
topicId: verwaltung-digital
text: >-
  Bauämter und Genehmigungsverfahren sollen konsequent digitalisiert und
  beschleunigt werden – auch durch weniger Mitwirkungsrechte im Einzelfall.
rationale: >-
  SPD treibt „Bau-Turbo" und KI-Digitalisierung voran, Linke lehnen das
  Schneller-Bauen-Gesetz als Schwächung demokratischer Verfahren ab –
  Verwaltungsmodernisierung mit klarem Grundrechtsbezug.
quickMode: false
sources:
