- thesisId: haushaltsnotlage-investitionen-ueber-neue-kredite
  stance: 1
  status: clear
  justificationQuote: Wir wollen den Landeseigenen Wohnungsunternehmen jährlich bis zu 2 Milliarden Euro Eigenkapital zuführen, um damit den Bau von 7.500 kommunalen Wohnungen jährlich zu finanzieren.
  sourceLabel: Die Linke Berlin – Wahlprogramm AGH 2026
