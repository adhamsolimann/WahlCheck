id: personalabbau-in-der-verwaltung
topicId: haushalt-finanzen
text: >-
  Zur Sanierung des Haushalts soll das Personal in der Berliner Verwaltung
  abgebaut werden.
rationale: >-
  Haushaltsnotlage zwingt zu Prioritäten; Konsolidierung über Personalkürzung
  steht im Gegensatz zum Ausbau von Ämtern (z. B. Bauämter, Jugendämter), den
  mehrere Parteien fordern.
quickMode: true
sources:
