  partyId: tierschutzpartei
  title: "Tierschutzpartei: „Unser Name ist Fluch und Segen zugleich“"
  excerpt: >-
    Spitzenkandidat Nico Poschinski im Morgenpost-Porträt über die Kandidatur
    der Partei Mensch Klima Tierschutz, die gemeinsam mit der Klimaliste antritt
    und aktuell in drei Bezirksverordnetenversammlungen sitzt.
  sourceLabel: "Berliner Morgenpost"
  sourceUrl: "https://www.morgenpost.de/berlin/article412887552/berlin-wahl-2026-das-sind-die-wahlkampfthemen-der-tierschutzpartei.html"
- date: "2026-08-17"
  title: "Sieben Wahlprogramme, 16 Themen: Worüber die Parteien wirklich schreiben"
  excerpt: >-
    KI-gestützte Auswertung der Wahlprogramme: Arbeit und Soziales dominiert,
    die CDU setzt am stärksten auf Sicherheit (18 % des Texts), die AfD verknüpft
    Wohnen mit Migration, die FDP schreibt am meisten über Mobilität.
  sourceLabel: "Tagesspiegel (interaktiv)"
