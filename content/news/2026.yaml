  title: "Forsa: Die Linke deutlich vorn — CDU und AfD gleichauf"
  excerpt: >-
    Knapp vier Wochen vor der Wahl kommt die Linke auf 22 %, CDU und AfD auf
    je 18 %, Grüne 16 %, SPD 12 %. BSW und FDP verpassen den Einzug. Rot-Grün-Rot
    wäre laut Umfrage das beliebteste Bündnis (37 %).
  sourceLabel: "WELT / Forsa für t-online"
  sourceUrl: "https://www.welt.de/politik/deutschland/article6a88eb35c3692834ff6d8eb5/berlin-linke-in-wahl-umfrage-ploetzlich-deutlich-vor-cdu-und-afd-spd-abgeschlagen.html"
- date: "2026-08-22"
  partyId: cdu
  title: "Wegner zurückgetreten — Evers übernimmt Bürgermeisterkandidatur"
  excerpt: >-
    Kai Wegner zog nach Kritik an seiner Krisenkommunikation infolge des
    tagelangen Stromausfalls als Spitzenkandidat zurück; Finanzsenator Stefan
    Evers übernimmt. Der Senat CDU–SPD liegt in der Forsa-Umfrage nur noch bei
    30 %.
  sourceLabel: "t-online / Forsa"
  sourceUrl: "https://www.t-online.de/nachrichten/deutschland/innenpolitik/id_101399250/neue-umfrage-zur-berlin-wahl-2026-linke-legen-zu-cdu-und-afd-gleichauf.html"
- date: "2026-08-19"
  partyId: tierschutzpartei
  title: "Tierschutzpartei: „Unser Name ist Fluch und Segen zugleich“"
  excerpt: >-
    Spitzenkandidat Nico Poschinski im Morgenpost-Porträt über die Kandidatur
    der Partei Mensch Klima Tierschutz, die gemeinsam mit der Klimaliste antritt
    und aktuell in drei Bezirksverordnetenversammlungen sitzt.
  sourceLabel: "Berliner Morgenpost"
  sourceUrl: "https://www.morgenpost.de/berlin/article412887552/berlin-wahl-2026-das-sind-die-wahlkampfthemen-der-tierschutzpartei.html"
- date: "2026-08-17"
  title: "Sieben Wahlprogramme, 16 Themen: Worüber die Parteien wirklich schreiben"
  excerpt: >-
    KI-gestützte Auswertung der Wahlprogramme: Arbeit und Soziales dominiert,
    die CDU setzt am stärksten auf Sicherheit (18 % des Texts), die AfD verknüpft
    Wohnen mit Migration, die FDP schreibt am meisten über Mobilität.
  sourceLabel: "Tagesspiegel (interaktiv)"
