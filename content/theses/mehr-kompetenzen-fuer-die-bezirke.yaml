id: mehr-kompetenzen-fuer-die-bezirke
topicId: verwaltung-digital
text: >-
  Die zwölf Berliner Bezirke sollen mehr Entscheidungskompetenzen und eigene
  finanzielle Spielräume erhalten.
rationale: >-
  Berlin-typische Strukturfrage (Zentralstadt vs. Kiezkultur); berührt
  Planungshoheit, Grünanlagen, Straßenreinigung – differenziert föderale
  Selbstverständnisse.
