id: rund-um-die-uhr-digitale-buergerservices
topicId: verwaltung-digital
text: >-
  Behördengänge (Anträge, Bescheinigungen, Termine) sollen flächendeckend rund
  um die Uhr digital möglich sein.
rationale: >-
  Verwaltung ist laut Tagesspiegel eines der Felder, das die CDU betont;
  Digitalisierung ist der messbarste Teil der Verwaltungsreformdebatte.
