packages:
  - "apps/*"
  - "packages/*"

# Native-Build-Freigaben (pnpm ≥11 Format):
# - esbuild BRAUCHT sein Postinstall (Platform-Binary für tsx/vitest)
# - sharp wird bewusst nicht gebaut: statischer Export ohne Bildoptimierung
allowBuilds:
  esbuild: true
  sharp: false

# Kompatibilität für pnpm ≤10 (Netlify/CI mit älterer Version)
onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  - sharp

overrides:
  postcss: ^8.5.23
  sharp: ^0.35.0
