id: netto-null-bei-neuversiegelung
topicId: klima
text: >-
  Berlin soll Netto-Null bei der Neuversiegelung von Boden erreichen: neuer
  versiegelter Fläche steht gleichviel entsiegelte gegenüber.
rationale: >-
  SPD nennt das Ziel explizit im Wohnkapitel; verbindet Stadtentwicklung,
  Hitzevorsorge und Bodenpolitik – differenziert Wachstums- von
  Schrumpfungslogiken im Bauen.
quickMode: false
sources:
  - label: SPD Berlin – Wahlprogramm 2026 (PDF, Kapitel Wohnen)
    url: https://spd.berlin/media/2026/06/SPD_Berlin_Wahlprogramm_20260521-v3-4.pdf
