id: ausbau-queerer-gesundheitsversorgung
topicId: stadtgesellschaft
text: >-
  Versorgungsangebote für queere und trans Personen (Gesundheit, Beratung)
  sollen deutlich ausgebaut werden.
rationale: >-
  SPD, Grüne, Linke und FDP fordern laut Tagesspiegel-Analyse bessere Angebote,
  CDU/BSW/AfD gehen auf die Themen nicht ein – saubere Differenzlinie im
  Gesellschaftsbereich.
