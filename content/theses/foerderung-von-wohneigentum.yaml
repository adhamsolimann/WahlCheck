id: foerderung-von-wohneigentum
topicId: wohnen
text: >-
  Der Erwerb selbstgenutzten Wohneigentums soll durch Zuschüsse,
  Steuererleichterungen und Mietkaufmodelle gefördert werden.
rationale: >-
  CDU und FDP setzen auf Eigentumsbildung als Weg zu bezahlbarem Wohnen, Linke
  und Grüne priorisieren den gemeinwohlorientierten Mietmarkt – klassische
  Eigentums-vs-Mietmarkt-Linie.
quickMode: false
sources:
