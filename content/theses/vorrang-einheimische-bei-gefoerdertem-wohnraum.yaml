id: vorrang-einheimische-bei-gefoerdertem-wohnraum
topicId: wohnen
text: >-
  Geförderter Wohnraum soll bevorzugt an Menschen vergeben werden, die in
  Berlin geboren sind oder lange hier leben.
rationale: >-
  Von der AfD eingebrachte Zuteilungslogik (Punktesystem), die Wohnen mit
  Migrationspolitik verknüpft; laut Tagesspiegel-Analyse verbindet fast jede
  zweite AfD-Stelle zum Wohnen diesen Vorrang-Gedanken.
quickMode: true
