id: vergesellschaftung-grosser-wohnungskonzerne
topicId: wohnen
text: >-
  Die Wohnungsbestände großer, renditeorientierter Wohnungskonzerne sollen
  vergesellschaftet werden.
rationale: >-
  Folge des Volksentscheids „Deutsche Wohnen & Co. enteignen" (2021, Mehrheit von
  56 %); eine der schärfsten Differenzlinien zwischen den Parteien und Kernthema
  des salienstärksten Politikfelds Wohnen.
quickMode: true
