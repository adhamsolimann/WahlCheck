id: gemeinschaftsschule-fuer-alle
topicId: bildung
text: >-
  Berlin soll schrittweise zur Gemeinschaftsschule übergehen, die alle Kinder
  unabhängig von der Herkunft gemeinsam bis zum Abitur führt.
rationale: >-
  Strukturfrage der Berliner Schulpolitik mit klarem Lagergegensatz zwischen
  gemeinsamer Schule und dem gegliederten System (Gymnasium/Integrierte
  Sekundarschule); Bildung ist Top-5-Salienzthema.
quickMode: true
