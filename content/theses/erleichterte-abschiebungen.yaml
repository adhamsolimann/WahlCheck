id: erleichterte-abschiebungen
topicId: migration
text: >-
  Abgelehnte Asylbewerberinnen und Asylbewerber sollen konsequenter und
  schneller abgeschoben werden.
rationale: >-
  Migration zählt zu den wichtigsten Themen der Berliner Wählerschaft; AfD
  verknüpft das Feld mit Sicherheit und Wohnen, CDU setzt die SPD hier unter
  Druck (Ipsos-Kompetenzanalyse).
