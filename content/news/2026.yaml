  partyId: cdu
  title: "Wegner zurückgetreten — Evers übernimmt Bürgermeisterkandidatur"
  excerpt: >-
    Kai Wegner zog nach Kritik an seiner Krisenkommunikation infolge des
    tagelangen Stromausfalls als Spitzenkandidat zurück; Finanzsenator Stefan
    Evers übernimmt. Der Senat CDU–SPD liegt in der Forsa-Umfrage nur noch bei
    30 %.
  sourceLabel: "t-online / Forsa"
  sourceUrl: "https://www.t-online.de/nachrichten/deutschland/innenpolitik/id_101399250/neue-umfrage-zur-berlin-wahl-2026-linke-legen-zu-cdu-und-afd-gleichauf.html"
