- thesisId: beschleunigte-schulsanierung
  stance: 1
  status: clear
  verification: "auto"
  justificationQuote: Deshalb wollen wir die Schulbauoffensive ausgehend von einer wiedereinzuführenden landesweiten Schulentwicklungsplanung, die durch verbindliche bezirkliche Schulentwicklungsplanungen ergänzt wird, fortsetzen und wo möglich beschleunigen.
  sourceLabel: Die Linke Berlin – Wahlprogramm AGH 2026
  sourceUrl: https://dielinke.berlin/fileadmin/download/2026/0106_Wahlprogramm_LVB_A5.pdf
- thesisId: mehr-polizeipersonal
