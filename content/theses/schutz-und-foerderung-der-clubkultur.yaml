id: schutz-und-foerderung-der-clubkultur
topicId: stadtgesellschaft
text: >-
  Berliner Clubs und die Nachtwirtschaft sollen durch Spielstättenförderung und
  Schutz vor Verdrängung dauerhaft gesichert werden.
rationale: >-
  Clubkultur als Wirtschaftsfaktor und Identitätsthema der Stadt; SPD schlägt
  Spielstättenförderung/Nachtökonomie-Strategie vor, Grüne/Linke wollen Schutz
  vor steigenden Gewerbemieten (Tagesspiegel).
