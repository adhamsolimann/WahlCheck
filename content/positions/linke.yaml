# T-105/T-132 — Positionen der Linken; Zitate wörtlich aus dem
# Wahlprogramm zur Abgeordnetenhauswahl 2026 (Endfassung, September 2026).
partyId: linke
positions:
  # --- Wohnen ---
  - thesisId: vergesellschaftung-grosser-wohnungskonzerne
    stance: 2
    status: clear
    justificationQuote: >-
      Dieses Votum bietet keinen Interpretationsspielraum: Berlin will
      vergesellschaften und 220.000 Wohnungen in öffentliche Hand überführen.
    sourceLabel: "Die Linke Berlin – Wahlprogramm AGH 2026"
    sourceUrl: "https://dielinke.berlin/partei/wahlen/abgeordnetenhauswahlen-2026/"
    verification: "auto"
  - thesisId: mietendeckel-landeseigene-wohnungsunternehmen
    stance: 2
    status: clear
    justificationQuote: >-
      Innerhalb der ersten 100 Tage der neuen Regierung wollen wir auf
      Grundlage eines Senatsbeschlusses einen Mietendeckel für die
      Landeseigenen Wohnungsunternehmen (LWU) einführen.
    sourceLabel: "Die Linke Berlin – Wahlprogramm AGH 2026"
    sourceUrl: "https://dielinke.berlin/partei/wahlen/abgeordnetenhauswahlen-2026/"
    verification: "auto"
  - { thesisId: randbebauung-tempelhofer-feld, stance: null, status: none, verification: pending }
  - { thesisId: grundsteuer-c-baureife-grundstuecke, stance: null, status: none, verification: pending }
  - thesisId: sozialwohnungsquote-im-baulandmodell
    stance: 1
    status: clear
    justificationQuote: >-
      Private Wohnungsbauunternehmen bauen bislang nur dann und nur in
      geringem Ausmaß bezahlbare Wohnungen, wenn sie vom Land Berlin und den
      Bezirken durch die Kooperative Baulandentwicklung dazu verpflichtet
      werden.
    sourceLabel: "Die Linke Berlin – Wahlprogramm AGH 2026"
    sourceUrl: "https://dielinke.berlin/partei/wahlen/abgeordnetenhauswahlen-2026/"
    verification: "auto"
  - thesisId: privatisierungsverbot-in-der-verfassung
    stance: 2
    status: clear
    justificationQuote: >-
      Einzelnen Wohnungen der LWU schließen wir aus und setzen uns für ein
      dauerhaftes Privatisierungsverbot in der Berliner Verfassung ein.
    sourceLabel: "Die Linke Berlin – Wahlprogramm AGH 2026"
    sourceUrl: "https://dielinke.berlin/partei/wahlen/abgeordnetenhauswahlen-2026/"
    verification: "auto"
  - { thesisId: vorrang-einheimische-bei-gefoerdertem-wohnraum, stance: null, status: none, verification: pending }
  - thesisId: abschaffung-modernisierungsumlage
    stance: 2
    status: clear
    justificationQuote: >-
      Die Modernisierungsumlage wollen wir abschaffen.
    sourceLabel: "Die Linke Berlin – Wahlprogramm AGH 2026"
    sourceUrl: "https://dielinke.berlin/partei/wahlen/abgeordnetenhauswahlen-2026/"
    verification: "auto"
  - { thesisId: foerderung-von-wohneigentum, stance: null, status: none, verification: pending }
  - thesisId: einschraenkung-moeblierter-wohnraum
    stance: 1
    status: clear
    justificationQuote: >-
      Abzocke mit möblierten Wohnungen beenden und die großen
      Immobilienkonzerne vergesellschaften.
    sourceLabel: "Die Linke Berlin – Wahlprogramm AGH 2026"
    sourceUrl: "https://dielinke.berlin/partei/wahlen/abgeordnetenhauswahlen-2026/"
    verification: "auto"
  # --- Haushalt & Finanzen ---
  - thesisId: haushaltsnotlage-investitionen-ueber-neue-kredite
    stance: 1
    status: clear
    justificationQuote: >-
      Wir wollen den Landeseigenen Wohnungsunternehmen jährlich bis zu
      2 Milliarden Euro Eigenkapital zuführen, um damit den Bau von 7.500
      kommunalen Wohnungen jährlich zu finanzieren.
    sourceLabel: "Die Linke Berlin – Wahlprogramm AGH 2026"
    sourceUrl: "https://dielinke.berlin/partei/wahlen/abgeordnetenhauswahlen-2026/"
    verification: "auto"
  - thesisId: staerkere-besteurung-hoher-einkommen
    stance: 1
    status: clear
    justificationQuote: >-
      Wir werden die Einnahmen des Landes erhöhen und alle Möglichkeiten zur
      Umverteilung von oben nach unten nutzen. Deswegen wollen wir eine
      Luxusvillensteuer einführen.
    sourceLabel: "Die Linke Berlin – Wahlprogramm AGH 2026"
    sourceUrl: "https://dielinke.berlin/partei/wahlen/abgeordnetenhauswahlen-2026/"
    verification: "auto"
