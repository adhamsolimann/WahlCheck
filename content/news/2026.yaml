  partyId: volt
  title: "Volt startet Kampagne „unf*ck Berlin“ mit 98 Best-Practice-Ideen"
  excerpt: >-
    Programm präsentiert als konkreter Plan in sieben Kapiteln — von Verwaltung
    (Once-Only-Prinzip, Genehmigungsfiktion) über Housing First bis zur
    Absicherung der Clubkultur. Volt tritt in allen 78 Wahlkreisen an.
  sourceLabel: "Volt Berlin"
  sourceUrl: "https://voltdeutschland.org/berlin/neuigkeiten/unfuck-berlin-reveal"
- date: "2026-07-10"
  partyId: sgp
  title: "SGP-Wahlerklärung: „Sozialismus statt Krieg“"
  excerpt: >-
    Die trotzkistische SGP begründet ihre Kandidatur mit Gegenposition zu
    Aufrüstung und Sozialkürzungen; fordert Enteignung von Banken und Konzernen
    unter demokratischer Kontrolle.
  sourceLabel: "World Socialist Web Site"
  sourceUrl: "https://www.wsws.org/de/articles/2026/07/10/sgpb-j10.html"
