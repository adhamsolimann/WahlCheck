id: dezentrale-unterkuenfte-statt-notunterkuenfte
topicId: migration
text: >-
  Notunterkünfte für Geflüchtete sollen abgeschafft und durch dezentralen
  Wohnraum ersetzt werden.
rationale: >-
  SPD fordert laut Tagesspiegel-Analyse genau diese Umstellung – ein Beispiel,
  dass Migrationspolitik im bürgerlichen Lager nicht eindimensional verläuft;
  trennt Vollzugsfragen von Grundsatzdebatten.
