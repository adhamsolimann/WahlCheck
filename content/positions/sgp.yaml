      Die reichlich vorhandenen industriellen und technologischen Kapazitäten
      müssen genutzt werden, um Wohnungen, Krankenhäuser, Schulen und eine
      moderne öffentliche Infrastruktur zu schaffen.
    sourceLabel: "SGP – Wahlerklärung Berlinwahl 2026"
    sourceUrl: "https://www.wsws.org/de/articles/2026/07/10/sgpb-j10.html"
    verification: "auto"
