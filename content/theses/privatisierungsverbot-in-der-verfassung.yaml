id: privatisierungsverbot-in-der-verfassung
topicId: wohnen
text: >-
  Ein dauerhaftes Privatisierungsverbot für landeseigene Wohnungen soll in der
  Verfassung von Berlin verankert werden.
rationale: >-
  Linke fordern das Verbot ausdrücklich auf Verfassungsebene, die CDU lehnt ein
  dauerhaftes Privatisierungsverbot ab; schärft die Frage nach dem langfristigen
  Schicksal der rund 400.000 LWU-Wohnungen.
quickMode: false
sources:
  - label: rbb24 – Das planen die Berliner Parteien in der Wohnungspolitik (08/2026)
    url: https://www.rbb24.de/politik/berlin-wahl-2026/wahlprogramme/wohnen-bauen-mieten-check.html
