  justificationQuote: Menschen mit wenig Geld, die heute noch über 27 Euro für das Sozialticket zahlen müssen, bieten wir bezahlbare und klimafreundliche Mobilität für neun Euro im Monat an.
- thesisId: prioritaet-fuer-radverkehr
  stance: 2
  status: clear
  verification: "auto"
