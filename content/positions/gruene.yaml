  justificationQuote: Unser Ziel ist ein digitales Bürger*innenamt mit Videoberatung, Einfacher Sprache, digitalen Assistenzen, barrierefreier mobiler Nutzung und Echtzeit-Statusanzeigen für Anträge.
- thesisId: mehr-kompetenzen-fuer-die-bezirke
