id: grundsteuer-c-baureife-grundstuecke
topicId: wohnen
text: >-
  Unbebaute, aber baureife Grundstücke sollen mit einer Grundsteuer C belegt
  werden, um Baulücken schneller für Wohnungsbau zu mobilisieren.
rationale: >-
  Konkretes Steuerungsinstrument gegen Bodenspekulation; unterscheidet aktive
  Bodenpolitik von marktkonformen Positionen.
