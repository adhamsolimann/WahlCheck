      Personen in Deutschland fast verdreifacht – auf 1,16 Billionen Euro. …
      Tatsächlich kann sich die Gesellschaft die Milliardäre nicht mehr leisten.
    sourceLabel: "SGP – Wahlerklärung Berlinwahl 2026"
    sourceUrl: "https://www.wsws.org/de/articles/2026/07/10/sgpb-j10.html"
    verification: pending
