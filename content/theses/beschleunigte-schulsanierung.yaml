id: beschleunigte-schulsanierung
topicId: bildung
text: >-
  Der Sanierungsstau bei Schulen soll durch ein deutlich beschleunigtes,
  finanziell aufgestocktes Schulbauprogramm abgebaut werden.
rationale: >-
  SPD nennt die „Schulbauoffensive" explizit als Investitionsschwerpunkt;
  Differenzierung entsteht über Tempo, Finanzierung und Beteiligungsverfahren.
quickMode: false
sources:
  - label: SPD Berlin – Wahlprogramm 2026 (PDF, Kapitel Schulbauoffensive)
    url: https://spd.berlin/media/2026/06/SPD_Berlin_Wahlprogramm_20260521-v3-4.pdf
