- date: "2026-08-15"
  title: "Ipsos-Wählerpotenzial: Vier Parteien innerhalb von zwei Punkten"
  excerpt: >-
    Kein klarer Favorit: SPD, Grüne, CDU und Linke liegen beim Wählerpotenzial
    dicht beieinander (31–33 %). 52 % können sich mindestens zwei Parteien
    vorstellen — der Wettbewerb spielt sich besonders links der Mitte ab.
  sourceLabel: "Ipsos"
  sourceUrl: "https://www.ipsos.com/de-de/umfrage-wahl-berlin"
- date: "2026-08-04"
  title: "Wahlprogramm-Check Wohnen: Mieten sind das Stadt-Thema"
  excerpt: >-
    rbb24 vergleicht die Wohnungspläne aller sieben aussichtsreichen Parteien —
    von Vergesellschaftung und Mietendeckel bis Tempelhofer Feld und
    Wohneigentumsförderung. Basis für einen Großteil unserer Wohnen-Thesen.
  sourceLabel: "rbb24"
  sourceUrl: "https://www.rbb24.de/politik/berlin-wahl-2026/wahlprogramme/wohnen-bauen-mieten-check.html"
- date: "2026-07-24"
  title: "Landeswahlausschuss lässt zwölf Landeslisten zu"
  excerpt: >-
    17 Parteien treten zur Abgeordnetenhauswahl an; Piraten, Freie Wähler,
    dieBasis und MERA25 scheiterten an den 2.200 Unterstützungsunterschriften.
    Kleine Parteien kritisieren Berlins hohe Hürde.
  sourceLabel: "Landeswahlleiter Berlin / rbb24"
  sourceUrl: "https://www.berlin.de/wahlen/pressemitteilungen/2026/pressemitteilung.1697177.php"
- date: "2026-07-22"
  partyId: dkp
  title: "DKP tritt mit Landesliste und Treptow-Köpenick-Direktkandidatur an"
  excerpt: >-
    Mit 2.480 gültigen Unterschriften übersprang die DKP die Hürde deutlich;
    das Wahlprogramm umfasst sechs thematische Schwerpunkte von Wohnungs- bis
    Verkehrspolitik.
  sourceLabel: "Unsere Zeit (UZ)"
  sourceUrl: "https://www.unsere-zeit.de/menschen-die-nicht-erst-seit-gestern-kaempfen-4816531/"
